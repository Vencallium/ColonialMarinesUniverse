# CMU14: standalone clothing simulator; no game server or submodules required.
name: CMU Dressing Room Pages
on:
  workflow_dispatch:
  push:
    branches: [master, main, Dressup-Website]
    paths:
      - 'Content.CMU/DressUp/**'
      - 'Content.CMU/Resources/**'
      - 'Resources/Prototypes/**'
      - 'Resources/Textures/**'
      - '.github/workflows/cmu-dressup-pages.yml'
permissions:
  contents: read
concurrency:
  group: cmu-dressup-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Content.CMU/DressUp/requirements.txt
      - run: pip install -r Content.CMU/DressUp/requirements.txt
      - run: python Content.CMU/DressUp/build.py
      - run: python Content.CMU/DressUp/test_build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Content.CMU/DressUp/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
