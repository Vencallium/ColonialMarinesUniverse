- type: entity
  id: CMUPlanetPyramid
  name: Pyramid Test
  components:
  - type: RMCPlanetMapPrototype
    votename: "Pyramid"
    mapId: Pyramid
    lorePrimer: AU14PrimerPlanetPyramid
    allegiance: UA
    camouflage: Desert
    announcement: "Pyramid a joint UA base and its surrounding settlement, has gone dark. A response force has been dispatched to re-establish contact."
    platoonsGovfor:
    - LACN
    - WEYU
    - USCM
    - CMBCIU
    - RMC
    - VAIPO
    platoonsOpfor:
    - UPP
    - ProdigySF
    - HAZOPS
    defaultgovfor: USCM
    defaultopfor: ProdigySF
    govforinship: false
    opforinship: true
    daycycleenabled: true
    thirdpartyinterval: 1800
    thirdparties:
    - ICRCReliefParty
    - TimeSharesSalesman
    - UPPGROM
    - UPPGROMAlt
    - UPPGROMAlt2
    - USArmyTank
    - UACGLostTeam
    - LACNSniperteam
    - cultistThirdParty
    - CMBInvestigationParty
    - CMBInvestigationPartyAlt
    - cultistThirdPartyNoQueen
    - ProfessorVonBandolier
    - XenoParasiteRunnerParty
    - ApeThirdParty
    - IPIE
    - IPIESynth
    - WYHT
    - WYPMCParty
    - WYPMCPartyAlt
    - biomorphThirdParty
    - tribalThirdParty
    - DrugSmuggler
    - CMBParoleeTransport
    - CMBParoleeTransportBig
    - ForeignCrimeGang
    - MigratingCivs
    - MigratingCivsMedium
    - MigratingCivsLarge
    - MissionariesParty
    - MissionariesPartyMedium
    threats:
    - XenoThreat
    - NeomorphsThreat
    # - BadBloodClanThreat
    - XenoThreatCF
    - NeomorphsThreatCF
    - CultistThreatCF
    - WendigoThreatCF
    - BiomorphsThreatCF
    - TribalsThreatCF
    - ApeThreatCF
    joboverrides:
      AU14JobLEOLeaderBase: AU14JobCivilianCMBMarshal
      AU14JobLEOBase: AU14JobCivilianCMBDeputy
    jobScalingFof: DefaultGovforOpforScale
    jobScalingIns: DefaultInsurgencyScale

- type: gameMap
  id: StableGarrisonRedux
  mapName: Stable Garrison
  allegiance: UA
  mapPath: /Maps/CMU14/PyramidMultiZ/PyramidMultiZ0.yml
  mapsBelow:
  - /Maps/CMU14/PyramidMultiZ/PyramidMultiZ-1.yml
  - /Maps/CMU14/PyramidMultiZ/PyramidMultiZ-2.yml
  mapsAbove:
  - /Maps/CMU14/PyramidMultiZ/PyramidMultiZ1.yml
  - /Maps/CMU14/PyramidMultiZ/PyramidMultiZ2.yml
  - /Maps/CMU14/PyramidMultiZ/PyramidMultiZ3.yml
  - /Maps/CMU14/PyramidMultiZ/PyramidMultiZ4.yml
  minPlayers: 0
  maxPlayers: 250
  maxRandomOffset: 0
  randomRotation: false
  stations:
    StableGarrisonRedux:
      stationProto: StandardUNMCWarship
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Stable Garrison'
        - type: StationJobs
          availableJobs:
            AU14JobCivilianColonist: [-1, -1]
            AU14JobCivilianJournalist: [1, 1]

            # Colony Service
            AU14JobCivilianHeadOfService: [1, 1]
            AU14JobCivilianShopkeep: [1, 1]
            AU14JobCivilianFoodServiceWorker: [3, 3]
            AU14JobCivilianWasteManagementSpecialist: [3, 3]

            AU14JobCivilianColonySynthetic: [2, 2]
            AU14JobColonyWorkingJoe: [2, 2]

            # Colony Command (non department)
            AU14JobCivilianColonyAdministrator: [1, 1]
            AU14JobCivilianColonyAdminAssistant: [1, 1]

            # Ambassadors
            AU14JobCivilianAmbassadorUA: [1, 1]
            AU14JobCivilianAmbassadorUPP: [1, 1]
            AU14JobCivilianAmbassadorTWE: [1, 1]

            # Corporate
            AU14JobCivilianCorporateLiaison: [1, 1]
            AU14JobCivilianCorporateAssistant: [1, 1]

            AU14JobCivilianScientist: [8, 8]
            AU14JobWYGuard: [8, 8]

            # Security/LEO
            AU14JobCivilianCMBMarshal: [1, 1]
            AU14JobCivilianCMBDeputy: [8, 8]

            # Engineering/Logi
            AU14JobCivilianForeman: [1, 1]
            AU14JobCivilianFreightSystemsSpecialist: [3, 3]

            AU14JobCivilianHeadOfEngineering: [1, 1]
            AU14JobCivilianEngineer: [4, 4]
            CMUJobCivilianAtmosian: [1, 2]
            AU14JobCivilianMiner: [-1, -1]

            # Medical
            AU14JobCivilianHeadPhysician : [1, 1]
            AU14JobCivilianPhysician: [4, 4]
            AU14JobCivilianNurse: [3, 3]
            AU14JobCivilianEthicsAndWellnessAdvisor: [1, 1]
            AU14JobCivilianEmergencyResponseOfficer: [1, 1]

            # Orbital
            AU14JobCivilianOrbitalArbiter: [1, 1]
            AU14JobCivilianOrbitalLawyer: [2, 3]
